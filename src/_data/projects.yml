items:
  - id: pattullo
    title: Pattullo Bridge
    loc: New Westminster, BC
    badge: Bridges & highways
    tags:
      - Chloride resistance
      - Freeze-thaw
      - 70+ MPa
    img: img/project-patullo-bridge.jpg
    alt: Pattullo Bridge arch over the Fraser River
    teaser: Durability and chloride resistance for a major river crossing exposed to decades of weather and traffic.
    long:
      - The Pattullo Bridge spans the Fraser River and sees year-round freeze-thaw cycles, deicing salts and constant heavy truck traffic. Those conditions let chlorides reach the reinforcing steel in ordinary concrete.
      - Silica fume cuts concrete permeability by an order of magnitude, slowing chloride ingress dramatically. Mixes with Elkon densified silica fume routinely reach 70+ MPa with fast early strength, which keeps a major crossing in service during construction.
    stats:
      - - 70+ MPa
        - Compressive strength
      - - 100+ yr
        - Service life target
      - - 8–10%
        - Silica fume dosage
    gallery:
      - img/project-patullo-bridge.jpg
      - img/project-aerial-1600.jpg
  - id: eaton
    title: Eaton Centre Montréal
    loc: Montréal, QC
    badge: High-rise
    tags:
      - HPC
      - Bulk pneumatic
      - Dense rebar
    img: img/project-eaton-centre.jpg
    alt: Eaton Centre building in downtown Montréal
    teaser: High-performance concrete for foundations and structure in a downtown commercial build.
    long:
      - Downtown commercial buildings need concrete strong enough for heavy vertical loads and fluid enough to work through densely reinforced sections without segregating.
      - Silica fume HPC does both. The fine particles fill voids between cement grains, raising strength and improving how fresh concrete flows. Elkon densified pellets batch cleanly through standard ready-mix equipment.
    stats:
      - - 65 MPa
        - Strength
      - - 7–9%
        - Dosage
      - - Bulk
        - Pneumatic delivery
    gallery:
      - img/project-eaton-centre.jpg
  - id: wind
    title: Wind Turbine Foundations
    loc: Québec
    badge: Energy
    tags:
      - Sulfate resistance
      - Cyclic loading
      - 25–40 yr life
    img: img/project-wind-turbines-1600.jpg
    alt: Wind turbines above a concrete foundation pour
    teaser: Mass concrete foundations that resist soil chemistry and fatigue for a multi-decade service life.
    long:
      - A utility-scale wind turbine sits on hundreds of cubic metres of structural concrete. The foundation has to handle cyclic loading from the rotor plus chemical attack from groundwater and soil for 25 to 40 years.
      - Silica fume densifies the concrete matrix, reducing permeability and resisting sulfate attack. A longer service life also means a lower lifetime carbon footprint per MWh.
    stats:
      - - 25–40 yr
        - Service life
      - - 8%
        - Avg dosage
      - - 100 m³+
        - Per foundation
    gallery:
      - img/project-wind-turbines-1600.jpg
  - id: parkade
    title: Precast Parking Structures
    loc: Western Canada
    badge: Parkades
    tags:
      - Low permeability
      - Precast
      - Deicing salts
    img: img/project-parkade.jpg
    alt: Precast concrete parking structure
    teaser: Precast elements that keep deicing salts away from the rebar in cold-climate parkades.
    long:
      - Parkade decks fail when chloride from deicing salts gets into the concrete and corrodes the steel. Once spalling starts, repairs get expensive fast.
      - Precast elements with silica fume have chloride permeability orders of magnitude lower than ordinary concrete. Combined with factory quality control, owners get much longer time to first repair.
    stats:
      - - <1000
        - Coulombs (RCPT)
      - - 8–10%
        - Dosage
      - - Precast
        - Factory QC
    gallery:
      - img/project-parkade.jpg
